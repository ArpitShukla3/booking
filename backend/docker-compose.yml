services:
  postgres:
    image: pgvector/pgvector:pg16 # TASK-X3: Postgres 16 + pgvector, same data volume
    container_name: booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking}
      POSTGRES_DB: ${DB_NAME:-booking}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-booking} -d ${DB_NAME:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TASK-X4: S3-compatible object storage for group trip photos (files only; metadata stays in Postgres).
  # Pinned: the official minio/minio images are no longer published, so this uses Bitnami's legacy build of
  # MinIO RELEASE.2025-04-22. Fine for local development; it gets no further updates.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    container_name: booking-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-booking}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-booking-secret}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-group-photos},${S3_BUCKET_TEST:-group-photos-test}
    ports:
      - "${S3_PORT:-9000}:9000" # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  miniodata:
